name: Secret Safety Scan

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  secret-scan:
    name: Secret scan (tracked files)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if tracked .env or backup bundles exist
        run: |
          set -euo pipefail
          echo "Checking tracked files for .env and backup bundles..."
          # `.env.example` is deliberately tracked and validated separately
          # below. Every other env file is prohibited.
          tracked_envs=$(git ls-files '*.env' '*.env.*' 2>/dev/null | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "${tracked_envs}" ]; then
            echo "ERROR: Tracked .env files detected:" >&2
            echo "${tracked_envs}" >&2
            exit 1
          fi
          tracked_bundles=$(git ls-files 'backup-*.bundle' '*.bundle' 2>/dev/null || true)
          if [ -n "${tracked_bundles}" ]; then
            echo "ERROR: Tracked backup bundle files detected:" >&2
            echo "${tracked_bundles}" >&2
            exit 1
          fi

      - name: Scan tracked files for private-key blocks
        run: |
          set -euo pipefail
          echo "Scanning tracked files for private-key PEM blocks..."
          # Use Git's tracked-file view and exclude this workflow's own
          # detection pattern, which would otherwise match itself.
          matches=$(git grep -I --line-number -E -- "-----BEGIN (RSA |DSA |EC |OPENSSH )?PRIVATE KEY-----|-----BEGIN PRIVATE KEY-----" -- ':(exclude).github/workflows/secret-scan.yml' || true)
          if [ -n "${matches}" ]; then
            echo "ERROR: Private-key block detected in tracked files:" >&2
            echo "${matches}" | awk -F: '{print $1":"$2""}' | sort -u >&2
            exit 1
          fi

      - name: Validate .env.example contains only placeholders
        run: |
          set -euo pipefail
          if [ ! -f .env.example ]; then
            echo ".env.example not present — skipping placeholder check"
            exit 0
          fi
          awk 'BEGIN{ok=1} /^[ \t]*#/ {next} /^[ \t]*$/ {next} { split($0,a,/=/); if (length(a)>=2) { val=a[2]; gsub(/^\s+|\s+$/,"",val); low=tolower(val); if (val=="" || low~/(replace|your|placeholder|redact|xxx|<.*>)/) { } else { print "Non-placeholder value in .env.example: "$0; ok=0 } } } END{ if (!ok) exit 2 }' .env.example

      - name: Done
        run: echo "Secret safety checks passed (no tracked .env, .bundle, or private keys)."
